- aid: tealium:tealium-ai-read-api
  name: Tealium AI Read API
  description: >-
    Tealium's own minimal, read-only API for AI agents, published as OpenAPI 3.0.3 at
    https://tealium.com/.well-known/openapi.yaml and discovered from https://tealium.com/llms.txt.
    Three unauthenticated GET operations — a status/heartbeat object, a global multilingual FAQ
    (question/answer pairs), and a pointer to the canonical documentation portal. Responses are
    cache-friendly and carry provenance headers (Cache-Control, X-Provenance). Governed by the
    usage rules in Tealium's agent manifest: attribution required, model training without consent
    disallowed.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
