method: searched
source: >-
  registry.npmjs.org, pub.dev, trunk.cocoapods.org, api.nuget.org, search.maven.org,
  github.com/Tealium releases API, and the Tealium install docs at docs.tealium.com/platforms/
description: >-
  Tealium's client libraries are mobile-and-web SDKs for the Universal Tag / Customer Data Hub,
  not REST clients for the V3 platform APIs. There is no first-party Python, Go, Ruby, PHP or Rust
  client for the Collect, Visitor Profile, Visitor Privacy, Moments or iQ Profiles APIs — those are
  called with plain HTTP. Every SDK below is first-party (published from the github.com/Tealium
  organization) and all but one are actively released.

packages:
  - language: swift
    platform: iOS / tvOS / watchOS / macOS
    registry: swiftpm
    name: tealium-swift
    url: https://github.com/tealium/tealium-swift
    install: 'Swift Package Manager — add package https://github.com/tealium/tealium-swift'
    official: true
    version: 2.18.4
    published: '2026-07-28'
    source: github releases (Tealium/tealium-swift)
    note: >-
      Recommended install path per Tealium docs. Also distributed via CocoaPods and Carthage.
    docs: https://docs.tealium.com/platforms/ios-swift/install/

  - language: swift
    platform: iOS
    registry: cocoapods
    name: tealium-swift
    url: https://cocoapods.org/pods/tealium-swift
    install: "pod 'tealium-swift'"
    official: true
    version: 2.9.2
    published: '2023-04-26'
    source: https://trunk.cocoapods.org/api/v1/pods/tealium-swift
    note: >-
      DECAY SIGNAL. The CocoaPods trunk holds 77 versions but the newest is 2.9.2 from April 2023,
      while the Swift Package Manager / GitHub release line is at 2.18.4 (July 2026). A consumer
      installing via CocoaPods is more than three years and nine minor versions behind the
      supported library. Tealium's docs now name Swift Package Manager as "recommended and
      simplest" but still list CocoaPods as an install option without flagging the gap.

  - language: kotlin
    platform: Android
    registry: maven
    name: com.tealium (Tealium Kotlin library)
    url: https://github.com/Tealium/tealium-kotlin
    install: 'Add the Tealium Maven repository to build.gradle, then the com.tealium module dependencies'
    official: true
    version: 1.9.2
    published: '2025-12-22'
    source: github releases (Tealium/tealium-kotlin)
    note: >-
      Not on Maven Central — a search for g:"com.tealium" on search.maven.org returns 0 artifacts.
      Tealium's install doc instructs adding a Tealium-hosted Maven repository URL to the project's
      top-level build.gradle, so there is no public registry metadata endpoint to read a version
      from; the version and date above come from the GitHub release, which is the authoritative
      published artifact for this library.
    docs: https://docs.tealium.com/platforms/android-kotlin/install/

  - language: dart
    platform: Flutter
    registry: pub.dev
    name: tealium
    url: https://pub.dev/packages/tealium
    install: 'flutter pub add tealium'
    official: true
    version: 4.0.0
    published: '2026-06-29'
    source: https://pub.dev/api/packages/tealium
    note: Wraps the native Swift and Kotlin libraries. Repo is Tealium/tealium-flutter.

