    version: 1.2.4
    published: '2026-02-09'
    source: https://api.nuget.org/v3/registration5-gz-semver2/tealium.maui/index.json

  - language: csharp
    platform: Xamarin
    registry: nuget
    name: Tealium.Xamarin
    url: https://www.nuget.org/packages/Tealium.Xamarin
    install: 'dotnet add package Tealium.Xamarin'
    official: true
    version: 2.1.0
    published: null
    source: https://azuresearch-usnc.nuget.org/query?q=tealium
    note: >-
      Version read from the NuGet search index; the publish date was not retrieved. Xamarin is
      superseded by .NET MAUI (Tealium.Maui) and this package is effectively legacy.

  - language: javascript
    platform: Web
    registry: cdn
    name: utag.js (Tealium Universal Tag)
    url: https://tags.tiqcdn.com/utag/{account}/{profile}/{environment}/utag.js
    install: >-
      <script src="//tags.tiqcdn.com/utag/{account}/{profile}/{environment}/utag.js"></script>
    official: true
    version: null
    published: null
    note: >-
      CDN-distributed and UNPINNED. The URL carries account, profile and environment (dev/qa/prod)
      but no version, so it always floats to whatever iQ last published for that profile — a
      consumer cannot tell from the URL which build they are loading. There is no registry metadata
      endpoint. The build identifier is only visible inside the file itself: fetching
      https://tags.tiqcdn.com/utag/tealium/docs/prod/utag.js on 2026-08-13 returned HTTP 200 with
      the header comment "utag.loader ut4.0.202504230113". Recorded as version null because that
      string is a per-profile publish artifact, not a package version a consumer can request.
    docs: https://docs.tealium.com/iq-tag-management/save-publish/manage-environments/

