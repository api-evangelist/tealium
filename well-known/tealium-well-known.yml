method: probed
source: live GET probes of every apis.yml baseURL host, every OpenAPI servers[] host, and the docs/marketing hosts
note: >-
  Tealium serves a real agent-discovery surface at the marketing root (tealium.com) — an agent
  manifest, a data taxonomy, and a small read-only OpenAPI — but serves nothing under
  /.well-known/ on any API host. The RFC 8615 standard paths (security.txt, openid-configuration,
  oauth-authorization-server, api-catalog, ai-plugin.json) return 404 everywhere. The documents
  Tealium does publish sit at non-standard well-known names discovered from https://tealium.com/llms.txt.
  Note that /.well-known/agents.json is NOT an A2A Agent Card — it declares its own
  $schema (agent-manifest.schema.json) and carries none of the A2A AgentCard shape — so no
  AgentCard pointer is emitted from it.

hosts:
  - host: https://tealium.com
    documents:
      - path: /.well-known/agents.json
        status: 200
        content_type: application/json
        file: tealium-agents.json
        kind: vendor-agent-manifest
        note: >-
          Tealium's own agent manifest, version 1.1. Declares organization + contact, three
          capabilities (faq_answering, docs_search, site_search), a taxonomy URL, consent policy
          URLs with gdpr/ccpa signals, four APIs (tealium-docs, collect-http-v3, collect-http-v1,
          ai-read), three read endpoints, sitemaps, locales, and usage rules
          (attribution_required: true, disallowed_uses: model_training_without_consent).
          Not an A2A Agent Card.
      - path: /.well-known/data-taxonomy.json
        status: 200
        content_type: application/json
        file: tealium-data-taxonomy.json
        kind: vendor-data-taxonomy
        note: Entity/field taxonomy (organization, website, solution, ...) mapped to schema.org types.
      - path: /.well-known/openapi.yaml
